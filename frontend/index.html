<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Evaluator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AI Prompt Evaluator</h1>

    <textarea id="prompt" placeholder="Enter your prompt..."></textarea>

    <textarea id="response" placeholder="Paste AI response here..."></textarea>

    <div class="rating">
      <button>Excellent</button>
      <button>Good</button>
      <button>Fair</button>
      <button>Poor</button>
    </div>

    <button id="submit">Submit Evaluation</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
